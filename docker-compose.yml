name: bookorbit

services:
  app:
    container_name: bookorbit-app
    image: ${APP_IMAGE?required}
    restart: unless-stopped
    init: true
    env_file:
      - .env
    ports:
      - "${APP_PORT:-3000}:${PORT:-3000}"
    environment:
      NODE_ENV: production
      PORT: ${PORT:-3000}
      DATABASE_URL: ${DATABASE_URL:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-postgres}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_USER: ${POSTGRES_USER?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?required}
      POSTGRES_DB: ${POSTGRES_DB?required}
      JWT_SECRET: ${JWT_SECRET?required}
      SETUP_BOOTSTRAP_TOKEN: ${SETUP_BOOTSTRAP_TOKEN?required}
      APP_URL: ${APP_URL?required}
      CLIENT_URL: ${CLIENT_URL:-${APP_URL?required}}
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      NODE_MAX_OLD_SPACE_SIZE: ${NODE_MAX_OLD_SPACE_SIZE:-2048}
      BOOK_DOCK_PATH: ${BOOK_DOCK_PATH:-}
      SYNC_ENABLED: ${SYNC_ENABLED:-false}
      SYNCTHING_URL: ${SYNCTHING_URL:-http://syncthing:8384}
      SYNCTHING_API_KEY: ${SYNCTHING_API_KEY:-}
      SYNC_EXPORT_PATH: ${SYNC_EXPORT_PATH:-}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${BOOKS_HOST_PATH:-./books}:/books
      - ./data/app:/data
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "const p=process.env.PORT||3000;fetch('http://127.0.0.1:'+p+'/api/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Device sync (Syncthing) sidecar — only started when the 'sync' profile is active:
  #   docker compose --profile sync up
  # Set SYNCTHING_API_KEY in .env before enabling. See .env.example for all sync options.
  syncthing:
    profiles: [sync]
    container_name: bookorbit-syncthing
    image: syncthing/syncthing:2.1.1@sha256:775c4aac486263ca8653055bba7d3061799281974b706695e17bc798da3f4e92
    restart: unless-stopped
    init: true
    environment:
      PUID: ${PUID:-1000}
      PGID: ${PGID:-1000}
      STGUIAPIKEY: ${SYNCTHING_API_KEY:-}
      STNODEFAULTFOLDER: "1"
    volumes:
      - ./data/syncthing:/var/syncthing
      - ./data/app:/data
    ports:
      # Sync traffic (BEP). Published on all interfaces by default so LAN devices
      # can connect. Set SYNCTHING_SYNC_BIND=127.0.0.1 to stop exposing it to the
      # LAN (e.g. relay-only, or when using the host-network override below).
      - "${SYNCTHING_SYNC_BIND:-0.0.0.0}:${SYNCTHING_SYNC_PORT:-22000}:22000/tcp"
      - "${SYNCTHING_SYNC_BIND:-0.0.0.0}:${SYNCTHING_SYNC_PORT:-22000}:22000/udp"
      - "${SYNCTHING_GUI_PORT:-127.0.0.1:8384}:8384"
    # LAN-only sync (no relays / global discovery, no internet dependency):
    #   1. Set "Network access -> LAN only" in the device plugin (KOSyncthing+).
    #   2. Disable global discovery + relays on this node in the Syncthing GUI,
    #      or via the REST API (PATCH /rest/config/options).
    #   3. For zero-config local discovery between this container and LAN devices,
    #      run the sidecar on the host network (Linux). Create a
    #      docker-compose.override.yml with:
    #        services:
    #          syncthing:
    #            network_mode: host   # published "ports" above are then ignored
    #      Otherwise keep bridge networking and pair using BookOrbit's address
    #      (tcp://<host-ip>:22000) so no discovery is needed.
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --header \"X-API-Key: $$STGUIAPIKEY\" http://127.0.0.1:8384/rest/system/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

  postgres:
    container_name: bookorbit-db
    image: pgvector/pgvector:pg16@sha256:7d400e340efb42f4d8c9c12c6427adb253f726881a9985d2a471bf0eed824dff
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD?required}
      POSTGRES_DB: ${POSTGRES_DB?required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
    healthcheck:
      test:
        ["CMD-SHELL", 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
